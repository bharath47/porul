<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Porul">
  <defs>
    <clipPath id="ring"><circle cx="64" cy="64" r="57"/></clipPath>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8f52"/><stop offset="1" stop-color="#6cc06f"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="61" fill="#faf7ef"/>
  <g clip-path="url(#ring)">
    <!-- sun -->
    <circle cx="43" cy="73" r="11" fill="#eaa53c"/>
    <!-- temple gopuram -->
    <g fill="#c6912c">
      <polygon points="29,80 57,80 49,45 37,45"/>
      <rect x="33" y="54" width="20" height="3.5"/>
      <rect x="35" y="62" width="16" height="3.5"/>
      <rect x="37" y="70" width="12" height="3.5"/>
      <polygon points="43,35 51,47 35,47"/>
    </g>
    <!-- water -->
    <path d="M6,90 q10,-7 20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#2f6ea5" stroke-width="4" stroke-linecap="round"/>
    <path d="M6,99 q10,-7 20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#3f7cb0" stroke-width="4" stroke-linecap="round"/>
    <!-- deepam lamp -->
    <ellipse cx="64" cy="73" rx="9" ry="4.5" fill="#d7a636"/>
    <path d="M53,74 q11,11 22,0 z" fill="#b9871f"/>
    <path d="M64,49 q7,11 0,20 q-7,-9 0,-20z" fill="#e8772a"/>
    <path d="M64,54 q3.5,8 0,13 q-3.5,-5 0,-13z" fill="#f4c62c"/>
    <!-- growth arrow + leaf -->
    <path d="M73,86 L86,73 L94,79 L107,58" fill="none" stroke="url(#arrow)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="109,55 112,72 96,64" fill="#2f8f52"/>
    <path d="M95,52 q9,-11 18,-6 q-3,11 -13,11z" fill="#68bd6c"/>
    <!-- rupee -->
    <text x="92" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#df8624">₹</text>
  </g>
  <circle cx="64" cy="64" r="61" fill="none" stroke="#c8a45c" stroke-width="4.5"/>
</svg>
